<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>会員ログイン | bonafe</title>
  <style>
    body { font-family: sans-serif; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; background: #f5f6f8; }
    .card { background: #fff; padding: 32px; border-radius: 12px; box-shadow: 0 4px 16px rgba(0,0,0,0.08); width: 100%; max-width: 360px; }
    h1 { font-size: 1.3rem; margin-top: 0; text-align: center; }
    input { width: 100%; padding: 10px 12px; margin: 8px 0 16px; border: 1px solid #ccc; border-radius: 6px; box-sizing: border-box; }
    button { width: 100%; padding: 12px; background: #1a73e8; color: #fff; border: none; border-radius: 6px; font-size: 1rem; cursor: pointer; }
    button:hover { background: #1557b0; }
    #message { color: #d93025; font-size: 0.9rem; margin-top: 12px; text-align: center; }
  </style>
</head>
<body>
  <div class="card">
    <h1>会員ログイン</h1>
    <form id="login-form" autocomplete="off">
      <label for="email">メールアドレス</label>
      <input type="email" id="email" autocomplete="off" placeholder="example@gmail.com" required />
      <label for="password">パスワード</label>
      <input type="password" id="password" autocomplete="new-password" placeholder="パスワード" required />
      <button type="submit">ログイン</button>
    </form>
    <p id="message"></p>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
    import { getAuth, signOut, signInWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

    const firebaseConfig = {
      apiKey: "AIzaSyBPyy3Kdw9z_DeMylbNx2txlj0sj5jzlI4",
      authDomain: "bonafe-project.firebaseapp.com",
      projectId: "bonafe-project",
      storageBucket: "bonafe-project.firebasestorage.app",
      messagingSenderId: "537942373363",
      appId: "1:537942373363:web:a6d0a99ab3f3078caf5886",
      measurementId: "G-KJZK2JVPL3"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);

    const form = document.getElementById("login-form");
    const emailInput = document.getElementById("email");
    const passwordInput = document.getElementById("password");
    const msg = document.getElementById("message");

    // 入力欄を空にして placeholder（example@gmail.com / パスワード）を表示する
    const resetInputs = () => {
      form.reset();
      emailInput.value = "";
      passwordInput.value = "";
      msg.textContent = "";
    };

    // 初回表示時と、ブラウザの「戻る」等でキャッシュから復元された時に実行
    resetInputs();
    window.addEventListener("pageshow", resetInputs);

    // login2.html を開いた時点で残っているセッションをクリア
    signOut(auth).catch(() => {});

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      msg.textContent = "ログイン中...";
      try {
        await signOut(auth).catch(() => {});
        await signInWithEmailAndPassword(auth, emailInput.value, passwordInput.value);
        resetInputs();
        window.location.href = "./member.html";
      } catch (err) {
        msg.textContent = "メールアドレスまたはパスワードが正しくありません。";
      }
    });
  </script>
</body>
</html>
