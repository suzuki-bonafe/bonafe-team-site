<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bonafe Team 会員ログイン</title>

<style>
body{
    margin:0;
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:#f4f7f4;
    font-family:"Yu Gothic","Meiryo",sans-serif;
}

.login-box{
    width:320px;
    background:white;
    padding:30px;
    border-radius:12px;
    box-shadow:0 0 15px rgba(0,0,0,0.15);
    text-align:center;
}

h1{
    color:#2c5e1a;
}

input{
    width:90%;
    padding:10px;
    margin:10px 0;
    font-size:16px;
}

button{
    width:100%;
    padding:12px;
    border:none;
    border-radius:6px;
    background:#2c5e1a;
    color:white;
    cursor:pointer;
}

button:hover{
    background:#214715;
}

.message{
    color:red;
    margin-top:10px;
}

.back-btn{
    display:inline-block;
    margin-top:15px;
    color:#2c5e1a;
    text-decoration:none;
    font-weight:bold;
}
</style>
</head>

<body onload="initLogin()">

<div class="login-box">

<h1>会員専用ページ</h1>

<p>
会員用合言葉を入力してください
</p>
<form autocomplete="off">
<input
type="text"
id="password"
name="club-key"
autocomplete="off"
spellcheck="false"
placeholder="合言葉"
onkeypress="checkEnter(event)">
<button
type="button"
onclick="login()">
入室
</button>
</form>
<br><br>

<a href="index.html" class="back-btn">
トップページへ戻る
</a>
<div id="message" class="message"></div>

</div>

<script>

function initLogin(){

    document.getElementById("password").value = "";
    document.getElementById("password").focus();

}

function checkEnter(event){

    if(event.key === "Enter"){
        login();
    }

}
function login(){

    const pass =
    document.getElementById("password").value;

    if(pass === "bonafe2026"){

        sessionStorage.setItem(
            "memberLogin",
            "ok"
        );

        document.getElementById("password").value = "";

        location.href =
        "member.html";

    }else{

        document.getElementById("message")
        .innerText =
        "合言葉が違います";

    }

}

</script>

</body>
</html>
