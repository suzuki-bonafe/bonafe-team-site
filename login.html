<!DOCTYPE html>
<html lang="ja">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Bonafe Team 会員入口</title>

<style>

body{
    margin:0;
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:#f4f7f4;
    font-family:"Yu Gothic","Meiryo",sans-serif;
}

.login-box{

    width:320px;
    background:white;
    padding:30px;
    border-radius:12px;
    box-shadow:0 0 15px rgba(0,0,0,0.15);
    text-align:center;

}

h1{
    color:#2c5e1a;
    margin-bottom:20px;
}

input{

    width:90%;
    padding:12px;
    font-size:16px;
    margin-bottom:15px;
    border:1px solid #999;
    border-radius:5px;

}

button{

    width:100%;
    padding:12px;
    background:#2c5e1a;
    color:white;
    border:none;
    border-radius:5px;
    cursor:pointer;

}

button:hover{
    background:#214715;
}

.message{

    color:red;
    margin-top:10px;
    min-height:20px;

}

.back-link{

    display:inline-block;
    margin-top:20px;
    color:#2c5e1a;
    text-decoration:none;
    font-weight:bold;

}

.back-link:hover{
    text-decoration:underline;
}

</style>

</head>

<body onload="initLogin()">

<div class="login-box">

<h1>会員専用ページ</h1>

<p>
会員用合言葉を入力してください
</p>

<form autocomplete="off">

<input
type="text"
id="password"
name="club-key"
autocomplete="off"
spellcheck="false"
placeholder="合言葉"
onkeypress="checkEnter(event)">

<button
type="button"
onclick="login()">

入室

</button>

</form>

<div
id="message"
class="message">
</div>

<a
href="index.html"
class="back-link">

← トップページへ戻る

</a>

</div>

<script>

function initLogin(){

    const box =
    document.getElementById("password");

    box.value = "";

    setTimeout(function(){

        box.value = "";
        box.focus();

    },100);

}

function checkEnter(event){

    if(event.key === "Enter"){

        event.preventDefault();
        login();

    }

}

function login(){

    const pass =
    document.getElementById("password").value;

    /*
      ↓↓↓
      お好きな合言葉に変更
      ↓↓↓
    */

    if(pass === "bonafe2026"){

        sessionStorage.setItem(
            "memberLogin",
            "ok"
        );

        document.getElementById("password").value = "";

        location.href =
        "member.html";

    }else{

        document.getElementById("message")
        .innerText =
        "合言葉が違います";

        document.getElementById("password").value = "";

        document.getElementById("password").focus();

    }

}

</script>

</body>

</html>
