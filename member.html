<!DOCTYPE html>
<html lang="ja">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<meta http-equiv="Cache-Control"
content="no-cache, no-store, must-revalidate">

<meta http-equiv="Pragma"
content="no-cache">

<meta http-equiv="Expires"
content="0">

<title>会員ページ | Bonafe Team</title>

<style>

body{
    margin:0;
    font-family:"Yu Gothic","Meiryo",sans-serif;
    background:#f4f7f4;
    line-height:1.8;
}

header{
    background:#2c5e1a;
    color:white;
    text-align:center;
    padding:25px;
}

nav{
    background:#3d7e25;
    text-align:center;
    padding:12px;
}

nav a{
    color:white;
    text-decoration:none;
    margin:10px;
    font-weight:bold;
}

.logout-area{
    text-align:right;
    margin:15px;
}

.logout-btn{

    background:#b22222;
    color:white;
    border:none;
    padding:10px 20px;
    border-radius:5px;
    cursor:pointer;

}

.logout-btn:hover{
    background:#8b1a1a;
}

main{
    max-width:1000px;
    margin:auto;
    padding:15px;
}

section{
    background:white;
    margin:20px 0;
    padding:20px;
    border-radius:10px;
    box-shadow:0 2px 5px rgba(0,0,0,0.1);
}

h2{
    color:#2c5e1a;
    border-bottom:2px solid #2c5e1a;
    padding-bottom:5px;
}

.notice{
    background:#fff9d6;
    padding:10px;
    border-left:5px solid orange;
    margin:10px 0;
}

footer{
    background:#dfe7dd;
    text-align:center;
    padding:20px;
    margin-top:30px;
}

@media screen and (max-width:768px){

    nav a{
        display:block;
        margin:8px;
    }

    section{
        padding:15px;
    }

}

</style>

</head>

<body>

<header>

<h1>Bonafe Team 会員ページ</h1>

<p>会員向け情報の掲載ページです</p>

</header>

<nav>

<a href="index.html">
トップページへ戻る
</a>

</nav>

<div class="logout-area">

<button
class="logout-btn"
onclick="logout()">

ログアウト

</button>

</div>

<main>

<section>

<h2>今月の活動予定</h2>

<iframe
src="https://calendar.google.com/calendar/embed?src=e690c34ccabe8af2ad08ec5f85ced467ba5a94e9373d78fdabb6357ce80b8436@group.calendar.google.com"
style="border:0"
width="100%"
height="600"
frameborder="0"
scrolling="no">
</iframe>

</section>

<section>

<h2>お知らせ</h2>

<div class="notice">
【お知らせ】冬鳥シーズンが始まりました。観察マナーを守って活動しましょう。
</div>

<div class="notice">
【お知らせ】活動写真の募集を開始しました。
</div>

</ul>

</section>

<section>

<h2>ダウンロード資料</h2>

<ul>
<li><a href="#">探鳥会参加のしおり</a></li>
<li><a href="#">観察記録シート</a></li>
<li><a href="#">活動規約</a></li>
</ul>

</section>

</main>

<footer>

© Bonafe Team

</footer>

<script>

function logout(){

    if(confirm("ログアウトしますか？")){

        window.location.replace("login.html");

    }

}

</script>

</body>

</html>
